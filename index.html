<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121416">
  <title>Factorium</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="inv" class="hud"></div>

  <div id="topright" class="hud">
    <button id="btnMilestones" class="btn">Hitos</button>
    <button id="btnMenu" class="btn" aria-label="Menú">☰</button>
  </div>

  <div id="hint" class="hud"></div>

  <div id="toolbar" class="hud"></div>

  <div id="actions" class="hud">
    <button id="btnRotate" class="btn big" title="Girar (R)">⟳</button>
    <button id="btnErase" class="btn big" title="Borrar (X / clic derecho)">✖</button>
    <button id="btnCancel" class="btn big" title="Soltar herramienta (Q / Esc)">✋</button>
  </div>

  <div id="panel" class="hidden">
    <div class="panel-box">
      <button class="close btn" id="panelClose">✕</button>
      <div id="panelBody"></div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="debug" class="hidden"></div>
  <input type="file" id="importFile" accept="application/json,.json" class="hidden">

  <script type="module" src="src/main.js"></script>
</body>
</html>
